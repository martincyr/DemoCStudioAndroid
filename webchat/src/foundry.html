<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Microsoft Foundry</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="status">Waiting for configuration from the host app...</div>
      <div id="transcript"></div>
      <form id="composer" autocomplete="off">
        <input id="composer-input" type="text" placeholder="Ask the Foundry agent..." disabled />
        <button id="composer-send" type="submit" disabled>Send</button>
      </form>
    </div>
    <script src="bundle.js"></script>
  </body>
</html>
